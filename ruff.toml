# Linter + formatter config for the one Python helper in scripts/.
# The Go tree is covered by gofmt/go vet/staticcheck (see ci.yml); this file
# keeps the same posture for the Python side: correctness rules on, style
# opinions off, and every ignore below carrying the reason it exists.
line-length = 100
target-version = "py310"

[lint]
select = [
    "F",    # pyflakes: unused/undefined names, shadowed imports
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # import order
    "UP",   # pyupgrade: modern syntax for the pinned target
    "B",    # flake8-bugbear: mutable defaults, shadowed loop vars, ...
    "SIM",  # flake8-simplify
    "C4",   # comprehensions
    "RET",  # return flow
    "PIE",  # misc lints
    "PT",   # pytest style
    "PL",   # pylint
    "RUF",  # ruff-specific, incl. RUF100 (dead noqa)
    "S",    # bandit: assert/eval/weak-hash/subprocess misuse
    "BLE",  # blind except
    "ANN",  # missing type annotations
    "ARG",  # unused function arguments
    "TID",  # banned imports (relative imports above the top level, etc.)
    "TC",   # typing-only imports belong in a TYPE_CHECKING block
    "FA",   # __future__ imports that the pinned target already defaults to
    "A",    # builtin shadowing (a parameter named `id` or `type`)
    "T10",  # debugger left in the source
    "EM",   # exception messages must not be string literals
    "TRY",  # try/except/finally footguns
    "G",    # logging format
    "PERF", # per-call performance traps
    "FURB", # modern rewrites of the same semantics
    "SLOT", # dataclass __slots__ sanity
    "SLF",  # private member access from outside the class
    "PTH",  # os.path/open() where pathlib belongs
    "DTZ",  # naive datetimes where an aware one is meant
    "ISC",  # implicit string concat that reads as one token
    "LOG",  # logger misuse
    "FBT",  # boolean trap (positional bools)
    "Q",    # quote consistency beyond the formatter's style
    "EXE",  # shebang and executable-bit agreement
]
# `COM` is deliberately absent: COM812's missing trailing commas are the
# formatter's call, and the two rules disagree on the same lines.
ignore = [
    # Dataset converters carry their thresholds inline (page counts, minimum
    # answer length): they are read next to the filter that uses them, and
    # naming all of them would bury the conversion logic.
    "PLR2004",
]

[lint.per-file-ignores]
# Bulk dataset dumps (100s of MB) are written to /tmp, never into the repo.
"scripts/fetch_hf_datasets.py" = ["S108"]

[format]
quote-style = "double"
