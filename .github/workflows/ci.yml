name: CI

on:
  push:
    branches: [main]
    # A v* tag is a release: `make build` stamps the version from `git describe`,
    # so the tag is the version every consumer sees. The `release` job below
    # gates it on the changelog before the tag is published.
    tags: ["v*"]
  pull_request:
    branches: [main]

# Least privilege: every job here only reads the checkout (build/test/scan),
# so drop the default GITHUB_TOKEN from read-write down to read-only.
permissions:
  contents: read

# One place for every pinned tool version, shared by the steps that use it.
# GO_VERSION is the 1.25 release line, not a fixed patch: it is declared once
# here and read by every setup-go step, so the line cannot drift between jobs.
# It can still drift from the go directive in go.mod, which is why `make
# go-version-check` (part of `make check`) fails when this line sits below it.
# The non-Go linter pins live in the Makefile and reach this workflow through
# `make lint-ci`, so there is no second copy of them here to fall behind.
env:
  GO_VERSION: "1.25"

# Cancel superseded runs for the same branch/PR — a new push makes the
# in-flight run obsolete, so don't burn a runner finishing it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Before the toolchain is installed: GO_VERSION and go.mod's directive
      # are the only two places the Go line is written, and this is the job
      # that reads both. A line raised in go.mod without GO_VERSION following
      # it otherwise surfaces as "module requires Go X" under an unrelated
      # build error, which is the one message the go-version-check target
      # exists to replace.
      - name: Go version matches go.mod
        run: make go-version-check

      - uses: actions/setup-go@v7
        with:
          # Latest 1.25.x patch (not the vulnerable 1.25.0 the go.mod directive
          # would pin): picks up stdlib security backports so govulncheck is clean,
          # while staying on the 1.25 line that the pinned staticcheck supports.
          go-version: ${{ env.GO_VERSION }}
          cache: false  # no third-party deps / no go.sum to cache

      - name: Tidy
        # `make tidy-check` is the single copy of this logic, so CI and a
        # contributor's `make check` cannot drift apart. It uses
        # `git status --porcelain` rather than `git diff go.mod go.sum` because
        # this module has no dependencies and thus no go.sum — `git diff` errors
        # on the missing path, while status handles an absent file and still
        # catches a newly-created one.
        run: make tidy-check

      - name: Format
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Staticcheck
        # Installed through the Makefile target, which owns the module path and
        # the version choice (STATICCHECK_VERSION), so the local and CI linters
        # are the same one. The pin lives in the Makefile rather than in this
        # env block because `go install` reads it there, not from CI.
        run: |
          make tools-staticcheck
          staticcheck ./...

      - name: Test
        run: make test

      - name: Build
        # The Makefile's BUILDFLAGS/CGO_ENABLED, so CI checks the flags that
        # ship rather than a bare `go build` that shares none of them.
        run: make build-all

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Non-Go sources are held to the same bar as the Go tree: the Python
      # dataset helper, the shell smoke script, and this workflow's own YAML.
      # `make lint-ci` is `make lint-non-go` with the ruff and yamllint pins
      # already applied, so the rule set a contributor checks is the one
      # enforced here and the pins have one home (the Makefile). ruff and
      # yamllint go through pipx (ephemeral, nothing installed onto the runner
      # image); shellcheck is on the runner.
      - name: Non-Go linters
        run: make lint-ci

  # `go install` ships whatever the host platform is, so every GOOS users can
  # install on has to keep compiling. Unix-only syscalls (signals, process
  # groups) are the usual breakage here, so the matrix covers Windows and both
  # Unix flavors rather than just the runner's own.
  build:
    name: Build (${{ matrix.goos }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build
        run: make build-all
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

      - name: Vet
        run: make vet
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  # Reproducibility is a property of the build flags (-trimpath, a
  # SOURCE_DATE_EPOCH-derived stamp), so it can only be trusted if something
  # checks it. Build twice from different directories and diff: any leaked path,
  # timestamp, or VCS stamp shows up as a differing hash.
  repro:
    name: Reproducible build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build twice from different paths
        run: |
          set -euo pipefail
          # Pin the stamps: this step is here to catch paths, timestamps and VCS
          # state leaking into the binary, and `git describe` in a copied tree
          # can legitimately read differently (a refreshed index, a missing
          # .git). Fixing VERSION/COMMIT/SOURCE_DATE_EPOCH leaves exactly the
          # leak this step is meant to find, and makes it fail on that alone.
          export VERSION=repro-test COMMIT=repro-test SOURCE_DATE_EPOCH=1700000000
          # The two builds also run under different locales and timezones, so a
          # stamp that leaked one of them fails here instead of passing because
          # both runs happened to share a runner's environment. Only TZ is
          # varied: the second value must be a zone the runner's tzdata has.
          LC_ALL=C TZ=UTC make build
          mkdir -p "$RUNNER_TEMP/elsewhere"
          cp -r . "$RUNNER_TEMP/elsewhere/src"
          rm -f "$RUNNER_TEMP/elsewhere/src"/msc*
          (cd "$RUNNER_TEMP/elsewhere/src" && LC_ALL=C TZ=Asia/Tokyo make build)
          for bin in msc msc-bench msc-eval msc-qa; do
            a=$(sha256sum "$bin" | cut -d' ' -f1)
            b=$(sha256sum "$RUNNER_TEMP/elsewhere/src/$bin" | cut -d' ' -f1)
            if [ "$a" != "$b" ]; then
              echo "::error::$bin is not reproducible: $a != $b"
              if command -v diffoscope >/dev/null 2>&1; then
                diffoscope "$bin" "$RUNNER_TEMP/elsewhere/src/$bin" || true
              fi
              exit 1
            fi
            echo "ok  $bin  $a"
          done

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-24.04
    # The campaign is per target, not one shared budget: ~60 targets at the
    # 8s below, plus compile and startup per target, so a 15m cap was close
    # enough to the real runtime that a loaded runner could kill the job with
    # no finding to show. The cap is a backstop against a wedged target, not a
    # budget, so give it room.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Latest 1.25.x patch (not the vulnerable 1.25.0 the go.mod directive
          # would pin): picks up stdlib security backports so govulncheck is clean,
          # while staying on the 1.25 line that the pinned staticcheck supports.
          go-version: ${{ env.GO_VERSION }}
          cache: false  # no third-party deps / no go.sum to cache

      # Run a short campaign over every fuzz target. The seed corpora (including
      # past crashers) run under `go test` above; this also explores new inputs
      # briefly, so regressions surface on every push, not just on a manual run.
      - name: Fuzz (short campaign, all targets)
        run: FUZZTIME=8s make fuzz

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Latest 1.25.x patch (not the vulnerable 1.25.0 the go.mod directive
          # would pin): picks up stdlib security backports so govulncheck is clean,
          # while staying on the 1.25 line that the pinned staticcheck supports.
          go-version: ${{ env.GO_VERSION }}
          cache: false  # no third-party deps / no go.sum to cache

      # Scan reachable code against the Go vulnerability DB. The module has no
      # third-party dependencies, so this primarily catches stdlib CVEs tied to
      # the toolchain version — and guards future dependencies. The install
      # goes through the Makefile so the module path and version live there.
      - name: govulncheck
        run: |
          make tools-govulncheck
          govulncheck ./...

  release:
    name: Release notes
    # Only on a version tag, and only after the code checks are green: a release
    # notes gate that runs on an untagged commit checks nothing about this tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The gate reads the tag and the changelog; a shallow clone of a tag
          # push carries neither the full tag list nor the section order.
          fetch-depth: 0

      # The tag, the version the binary reports, and the notes are one fact
      # split across three places (CONTRIBUTING "Release"). A tag pushed
      # without its section cannot be fixed afterwards, so fail here instead.
      - name: Changelog documents the tagged version
        run: make check-release TAG="${{ github.ref_name }}"
