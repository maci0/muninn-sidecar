# Linter + formatter config for the Python sources (the one helper in
# scripts/ today; `make lint-non-go` runs ruff over the whole tree, so a
# Python file added elsewhere is covered by this file, not just by habit).
# The Go tree is covered by gofmt/go vet/staticcheck (see ci.yml); this file
# keeps the same posture for the Python side: correctness rules on, style
# opinions off, and every ignore below carrying the reason it exists.
line-length = 100
target-version = "py310"

[lint]
# `ALL`, not a hand-kept list of prefixes: a list only grows when someone
# remembers to extend it, and whole correctness families (airflow,
# tryceratops, eradicate, flake8-2020, todo/fixme hygiene) sat off that way
# while the style families stayed on. The tree passes the whole set today, so
# the strictest configuration ruff offers is also the free one. `preview` stays
# off, so `ALL` means the stable rule set: a ruff bump can still land a new
# stable rule, but never a preview one nobody opted into.
select = ["ALL"]

ignore = [
    # Trailing commas belong to `ruff format`, which adds them; COM812 reports
    # their absence, so the two rules disagree on the same lines and only one of
    # them edits the file.
    "COM",
    # Copyright headers. The repo carries its licence at the top level, and the
    # rule's own message asks for a "Copyright (c) [year] [fullname]"
    # placeholder rather than naming one.
    "CPY",
    # Docstring prose, not docstring defects. The rules contradict each other:
    # ruff reports D212/D213 and D203/D211 as incompatible and drops one of
    # each pair on every run, so which half is live is not readable here. The
    # tree also fails them today, so enabling the family means editing prose
    # before any of its useful half is checking anything.
    "D",
    # Dataset converters carry their thresholds inline (page counts, minimum
    # answer length): they are read next to the filter that uses them, and
    # naming all of them would bury the conversion logic.
    "PLR2004",
    # `print` in a script whose job is to write datasets and say what it wrote.
    "T20",
]

[lint.per-file-ignores]
# Bulk dataset dumps (100s of MB) are written to /tmp, never into the repo.
"scripts/fetch_hf_datasets.py" = ["S108"]

[format]
quote-style = "double"
